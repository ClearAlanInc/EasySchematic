name = "maestro-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[vars]
# Origins (comma-separated, no trailing slash) allowed to make credentialed
# requests and be used as login redirect targets, in addition to the official
# hosts and loopback. Set to wherever the app itself is served from.
ALLOWED_ORIGINS = "https://maestroconnect.clearalan.ca,https://www.maestroconnect.clearalan.ca,https://devices.maestroconnect.clearalan.ca"

# Microsoft Entra ID sign-in (the ClearAlan login provider). To enable:
#   1. Create an app registration in the Entra admin center with redirect URI
#      https://api.maestroconnect.clearalan.ca/auth/microsoft/callback (type "Web").
#   2. Set MS_CLIENT_ID here to the Application (client) ID, and MS_TENANT to
#      the Directory (tenant) ID so ONLY ClearAlan accounts can sign in
#      ("common" would allow any Microsoft account).
#   3. Store the client secret out-of-band: npx wrangler secret put MS_CLIENT_SECRET
# The login dialog shows a Microsoft button automatically once MS_CLIENT_ID is set
# (via GET /auth/providers).
# MS_CLIENT_ID = ""
# MS_TENANT = ""

[dev]
port = 8787
persist_to = ".wrangler/state"

[[d1_databases]]
binding = "maestro_db"
database_name = "maestro-db"
database_id = "26615646-10b7-4af7-86ed-c5f57d1b4243"

[[r2_buckets]]
binding = "SCHEMATIC_STORAGE"
bucket_name = "maestro-schematics"
