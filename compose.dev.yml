services:
  cadesign:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - cadesign-dev:/app
    environment:
      REPO_URL: https://dev.azure.com/ClearAlanInc/ClearAlan%20Inc/_git/caDesign
      BRANCH: master
    env_file:
      - path: .env
        required: false
    restart: "no"

volumes:
  cadesign-dev:
