  <body>
    <script>
      (function() {
        // One-time storage migration: browser data written under the previous
        // product name keeps working after the rename. Runs before any app code
        // reads storage; a no-op once every legacy key has been moved.
        try {
          var prefixes = ['easyschematic-', 'cadesign-'];
          var legacy = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (!k) continue;
            for (var p = 0; p < prefixes.length; p++) {
              if (k.indexOf(prefixes[p]) === 0) { legacy.push([k, prefixes[p]]); break; }
            }
          }
          for (var j = 0; j < legacy.length; j++) {
            var oldKey = legacy[j][0];
            var newKey = 'maestro-' + oldKey.slice(legacy[j][1].length);
            if (localStorage.getItem(newKey) === null) {
              localStorage.setItem(newKey, localStorage.getItem(oldKey));
            }
            localStorage.removeItem(oldKey);
          }
        } catch (e) { /* storage unavailable — nothing to migrate */ }
        var stored = localStorage.getItem('maestro-theme');
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
