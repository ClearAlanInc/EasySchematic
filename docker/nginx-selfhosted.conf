server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enforcement backstop for the fully-offline build (VITE_SELF_HOSTED=true):
    # the browser refuses ANY request to another origin, making "zero external
    # contact" a guarantee rather than an intention.
    #   - ws://127.0.0.1 / ws://localhost keep the MCP bridge working
    #   - img-src data:/blob: cover inline logos and canvas exports
    #   - style-src 'unsafe-inline' is required by React inline styles
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
